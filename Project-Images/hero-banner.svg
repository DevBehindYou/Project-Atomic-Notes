<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%" role="img" aria-label="Atomic Notes">
  <rect width="1200" height="260" fill="#F4F5F1" />

  <!-- Atom mark -->
  <g transform="translate(150, 130)">
    <ellipse cx="0" cy="0" rx="88" ry="32" fill="none" stroke="#3A2FF0" stroke-width="3" />
    <ellipse cx="0" cy="0" rx="88" ry="32" fill="none" stroke="#3A2FF0" stroke-width="3" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="88" ry="32" fill="none" stroke="#3A2FF0" stroke-width="3" transform="rotate(120)" />
    <circle cx="0" cy="0" r="17" fill="#15171B" />
    <circle cx="88" cy="0" r="7" fill="#3A2FF0" />
    <circle cx="-44" cy="76.2" r="7" fill="#3A2FF0" />
    <circle cx="-44" cy="-76.2" r="7" fill="#3A2FF0" />
  </g>

  <!-- Wordmark: crisp flat-color offset (no opacity blend, so it reads as registration-shift, not a blur) -->
  <text x="323" y="121" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="900" fill="#3A2FF0" letter-spacing="1">ATOMIC NOTES</text>
  <text x="320" y="118" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="900" fill="#15171B" letter-spacing="1">ATOMIC NOTES</text>

  <!-- Subtitle, mono voice — accurate to current app state -->
  <text x="322" y="158" font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="16" fill="#15171B" opacity="0.6" letter-spacing="2.5">LOCAL-FIRST &#183; NO TRACKING &#183; NO ADS</text>

  <!-- Hairline rule -->
  <line x1="60" y1="205" x2="1140" y2="205" stroke="#15171B" stroke-width="1" opacity="0.15" />

  <!-- Corner label -->
  <text x="1140" y="230" font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="13" fill="#15171B" opacity="0.45" text-anchor="end" letter-spacing="1">FLUTTER &#183; SUPABASE</text>
</svg>
