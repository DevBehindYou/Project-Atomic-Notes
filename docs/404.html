<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atomic Notes has moved</title>
<meta name="description" content="Atomic Notes has moved to atomic-notes-community.vercel.app. Local-first notes for Android that sync to your own Google Drive, with an optional end-to-end vault." />
<link rel="canonical" href="https://atomic-notes-community.vercel.app/" />
<meta http-equiv="refresh" content="0; url=https://atomic-notes-community.vercel.app/" />
<meta name="theme-color" content="#F4F5F1" />
<script>location.replace("https://atomic-notes-community.vercel.app/");</script>
<style>
  :root { --ink: #15171B; --paper: #F4F5F1; --signal: #3A2FF0; --slate: #4A4D55; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--paper); color: var(--ink);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background-image: radial-gradient(rgba(21, 23, 27, .12) 1.2px, transparent 1.3px);
    background-size: 22px 22px;
  }
  main {
    max-width: 520px; width: 100%; background: #fff; border: 2px solid var(--ink);
    border-radius: 8px; padding: 28px; box-shadow: 8px 8px 0 var(--signal);
  }
  p.eyebrow { font: 12px/1 ui-monospace, Consolas, monospace; letter-spacing: 2px; color: var(--signal); margin: 0 0 12px; }
  h1 { font-size: 30px; line-height: 1.1; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .5px; }
  p { margin: 0 0 18px; color: var(--slate); }
  a.btn {
    display: block; text-align: center; margin-top: 10px; padding: 12px 16px; border: 2px solid var(--ink);
    border-radius: 4px; text-decoration: none; color: var(--ink);
    font: 13px/1 ui-monospace, Consolas, monospace; letter-spacing: 1.4px; text-transform: uppercase;
  }
  a.btn.primary { background: var(--signal); color: #fff; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">ATOMIC NOTES</p>
  <h1>We've moved</h1>
  <p>Atomic Notes has a new home. Taking you to the new website now.</p>
  <a class="btn primary" href="https://atomic-notes-community.vercel.app/">Go to the Atomic Notes website</a>
  <a class="btn" href="https://github.com/DevBehindYou/Atomic-Notes-App-V0.2">View the app repository</a>
  <a class="btn" href="https://github.com/DevBehindYou/Atomic-Notes-App-V0.2/releases/latest">Download the latest APK</a>
</main>
</body>
</html>
